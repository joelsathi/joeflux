name: JoeFlux checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  # Basic checks only: no Chromium, FFmpeg, plugin bundles or docs site. Run `pnpm test` locally for the full suite.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run skills:check
      - run: pnpm run build:studio
      - run: pnpm run test:basic
